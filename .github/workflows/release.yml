name: Release

# Manual only. Creating a tag or a release never starts this workflow, so a release
# built and tested by hand is never rebuilt or overwritten. Run it from the Actions tab
# with an existing tag (for example v0.7.1). It refuses to replace assets that already
# exist on that release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.7.1 (the tag must already exist)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build the light installer and portable zip, then publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (with the Electron binary)
        run: npm ci

      - name: Test
        run: npm test

      # Light installer: no Android runtime inside. The app downloads the Android
      # Emulator and system image from dl.google.com on first run, so no Google
      # component is redistributed here.
      - name: Build the installer
        run: npx electron-builder --win nsis --publish never --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build the portable version
        run: npm run pack

      # 7-Zip -mx=9 keeps the portable zip under 100 MiB; build/zip.js fails the job above that.
      - name: Zip the portable version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Incremental update assets for the portable version (manifest + code-only zip).
      - name: Build incremental update assets
        shell: pwsh
        run: |
          node build/incremental.js dist/ApkStart-win64-portable "${{ inputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $ver = $tag.TrimStart('v')
          $files = @(
            (Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1).FullName,
            "ApkStart-$tag-win64-portable.zip",
            "ApkStart-v$ver-manifest.json",
            "ApkStart-v$ver-app.zip"
          )
          $lines = foreach ($f in $files) { $h = Get-FileHash -Algorithm SHA256 $f; "{0}  {1}" -f $h.Hash.ToLower(), (Split-Path $f -Leaf) }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Uploads without --clobber: if an asset with the same name is already on the
      # release (for example one tested by hand), the upload fails instead of replacing it.
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $ver = $tag.TrimStart('v')
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          if (-not $existing) {
            $notes = ".github/release-notes-$tag.md"
            if (Test-Path $notes) { gh release create $tag --verify-tag --title "ApkStart West $tag" --notes-file $notes }
            else { gh release create $tag --verify-tag --title "ApkStart West $tag" --generate-notes }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $setup = (Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1).FullName
          gh release upload $tag $setup "ApkStart-$tag-win64-portable.zip" "ApkStart-v$ver-manifest.json" "ApkStart-v$ver-app.zip" SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { Write-Error "Upload failed (an asset with the same name may already exist)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
