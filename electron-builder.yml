appId: com.apkstart.west
productName: ApkStart West
copyright: Copyright © 2026 ApkStart contributors and ApkStart West contributors

directories:
  output: dist/release
  buildResources: build

# Ship the source tree as plain files (no asar): the window helper needs real .ps1 paths.
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Used at runtime to unpack .xz system images (prebuilt N-API, no ABI issues).
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Keep only the interface languages the app offers.
electronLanguages:
  - en-US
  - pt-BR

# Light installer: no Android runtime inside. The app downloads the Android
# Emulator, platform-tools and the system image from dl.google.com on first
# run, so this installer redistributes no Google components.

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # The main program is ApkStart.exe (shortcuts, updater and leftovers cleanup expect this name).
  executableName: ApkStart
  # Installs for the current user only; no administrator rights.
  requestedExecutionLevel: asInvoker

nsis:
  # Standard wizard, so the user can pick the install folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # "always" recreates the desktop shortcut on every install, so it never points at an old folder.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkStart-${version}-Setup.exe
  shortcutName: ApkStart West
  # Stops this install's own runtime processes before uninstalling, so no file stays locked.
  include: build/installer.nsh

# zlib "normal": the payload is mostly Electron DLLs; "maximum" (LZMA) is much slower for little gain.
compression: normal

# ---------------- Linux ----------------
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: ApkStart West
      Comment: Run Android apps on Linux
      Categories: Utility;
